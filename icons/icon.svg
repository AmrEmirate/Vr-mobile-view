  </defs>
  
  <!-- Background Circle -->
  <rect width="128" height="128" rx="28" fill="#0b0f19"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <!-- VR Headset Body -->
  <path d="M 20 44 C 20 36 26 32 36 32 L 92 32 C 102 32 108 36 108 44 L 108 78 C 108 86 102 92 90 92 L 78 92 C 74 92 71 86 64 86 C 57 86 54 92 50 92 L 38 92 C 26 92 20 86 20 78 Z" fill="url(#vrGrad)" />
  
